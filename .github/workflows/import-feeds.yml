name: Import 2Performant Feeds

on:
  workflow_dispatch:
    # Allow manual trigger from the GitHub Actions UI

permissions:
  contents: read

jobs:
  import-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: import-2performant-feeds
      cancel-in-progress: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Import Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          ALLOW_RO_IMPORT: '1'
          TWO_PERFORMANT_FEED_URL_RO_ROWENTA: ${{ secrets.TWO_PERFORMANT_FEED_URL_RO_ROWENTA }}
          TWO_PERFORMANT_FEED_URL_RO_SCULE365: ${{ secrets.TWO_PERFORMANT_FEED_URL_RO_SCULE365 }}
        run: npx tsx src/scripts/run-import.ts --all
