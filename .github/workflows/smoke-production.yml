name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run production smoke checks
        run: node scripts/smoke-production.mjs
        env:
          SMOKE_BASE_URL: https://www.beforetobuy.com
